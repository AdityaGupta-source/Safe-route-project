<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Safe Route</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            opacity: 0;
        }
    </style>
</head>

<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div class="glass" style="padding: 2rem; max-width: 400px; width: 100%; text-align: center;">
        <h2 style="margin-bottom: 2rem;">Welcome Back</h2>
        <div class="input-group" style="margin-bottom: 1rem;">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" placeholder="Email Address">
        </div>
        <div class="input-group" style="margin-bottom: 1rem;">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Password">
        </div>
        <button class="btn btn-primary" style="width: 100%;">Login</button>
        <p style="margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem;">
            Don't have an account? <a href="register.html" style="color: var(--primary);">Register</a>
        </p>
        <div style="margin-top: 2rem;">
            <a href="index.html" class="btn btn-outline" style="font-size: 0.8rem;"><i
                    class="fa-solid fa-arrow-left"></i> Home</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Very subtle fade in
            gsap.to('body', { opacity: 1, duration: 0.8, ease: 'power2.out' });

            // Subtle lift for the card
            gsap.from('.glass', {
                y: 15,
                opacity: 0,
                duration: 1,
                ease: 'power3.out',
                delay: 0.1
            });

            // Minimal stagger for inputs
            gsap.from('.input-group', {
                y: 10,
                opacity: 0,
                duration: 0.8,
                stagger: 0.05,
                ease: 'power2.out',
                delay: 0.3
            });
        });
    </script>
</body>

</html>
